# ─────────────────────────────────────────────────────────────────────────────
# FinanceFlux — Orquestación de contenedores
#
# Uso:
#   Levantar todo el sistema:    docker-compose up --build -d
#   Ver logs en tiempo real:     docker-compose logs -f
#   Detener y eliminar:          docker-compose down
#   Resetear base de datos:      docker-compose down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de Datos ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: financeflux-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financeflux-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── API REST Spring Boot ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeflux-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - financeflux-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/swagger-ui/index.html"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── Frontend React + Nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeflux-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financeflux-net

# ── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Red interna ───────────────────────────────────────────────────────────────
networks:
  financeflux-net:
    driver: bridge

